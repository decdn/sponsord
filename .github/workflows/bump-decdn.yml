name: bump decdn

# Opens the PR that moves the decdn pin to decdn's latest release
# (RELEASING.md § Pinning decdn). decdn's publish-crates.sh starts it once
# crates.io serves the release; the schedule catches a start that never came.
#
# The decdn ref is never a run input: the workflow always takes decdn's latest
# published release (ci.yml explains why). It does nothing when the lock is
# already there, or when a PR for that release exists in any state — a closed
# one was closed on purpose.
#
# The PR is opened with a GitHub App token, not GITHUB_TOKEN: a PR that
# GITHUB_TOKEN opens or pushes to starts no workflow, so CI would never run on
# it. The App needs Contents and Pull requests (read and write) on this
# repository only; its client ID is the DECDN_BUMP_APP_CLIENT_ID variable and
# its key the DECDN_BUMP_APP_PRIVATE_KEY secret.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

concurrency:
  group: bump-decdn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: bump decdn
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # A run started from another branch would otherwise bump that branch
      # and open its commits against main.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Find decdn's latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/bump-decdn.sh latest | tee -a "$GITHUB_OUTPUT"

      # Only a PR counts. A branch without one is left over from a run whose
      # `gh pr create` failed, and "Open the PR" overwrites it.
      - name: Look for an existing bump
        id: existing
        if: steps.latest.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          branch="bump/decdn-${TAG}"
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all \
            --json number --jq 'length')
          if [[ "$prs" != 0 ]]; then
            echo "::notice::a PR for the bump to ${TAG} already exists (branch ${branch}); nothing to do"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # publish-crates.sh starts this workflow right after its uploads, and the
      # crates.io index can trail them by minutes.
      - name: Wait for crates.io
        id: ready
        if: steps.existing.outputs.found == 'false'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            rc=0
            .github/scripts/bump-decdn.sh ready "$TAG" || rc=$?
            if (( rc == 0 )); then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            (( rc == 3 )) || exit "$rc"
            (( attempt == 10 )) || sleep 120
          done
          echo "::notice::crates.io does not serve ${TAG} yet; the next scheduled run retries"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        if: steps.ready.outputs.ready == 'true'
        with:
          toolchain: 1.99.0

      - name: Move the pin
        id: bump
        if: steps.ready.outputs.ready == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          echo "old_sha=$(.github/scripts/bump-decdn.sh locked-sha)" >> "$GITHUB_OUTPUT"
          .github/scripts/bump-decdn.sh rewrite "$TAG"
          cargo update -p decdn-client -p decdn-common -p decdn-incentive -p decdn-e2e
          .github/scripts/bump-decdn.sh changelog "$TAG"
          echo "new_sha=$(.github/scripts/bump-decdn.sh locked-sha)" >> "$GITHUB_OUTPUT"
          git diff --stat

      # A failure here still opens the PR, for a human to finish; the job fails
      # after it.
      - name: Check the pin
        id: check
        if: steps.ready.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          .github/scripts/check-decdn-pin.sh

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: steps.ready.outputs.ready == 'true'
        with:
          client-id: ${{ vars.DECDN_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.DECDN_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the PR
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TAG: ${{ steps.latest.outputs.tag }}
          OLD_TAG: ${{ steps.latest.outputs.current }}
          OLD_SHA: ${{ steps.bump.outputs.old_sha }}
          NEW_SHA: ${{ steps.bump.outputs.new_sha }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          branch="bump/decdn-${TAG}"
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          git switch -c "$branch"
          git add Cargo.toml Cargo.lock crates/*/CHANGELOG.md
          git commit -q -F - <<EOF
          build: pin decdn to ${TAG}

          Lock the decdn crates at decdn's ${TAG} release tag (${NEW_SHA})
          instead of ${OLD_TAG:-the previous pin} (${OLD_SHA}), and require ${TAG#v},
          which is on crates.io.
          EOF
          # Forced: the branch may be left over from a run that pushed it but
          # opened no PR. "Look for an existing bump" stops before here when a
          # PR exists.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"

          compare="https://github.com/decdn/decdn/compare/${OLD_SHA}...${NEW_SHA}"
          others=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"bump/decdn-\")) | select(.headRefName != \"${branch}\") | \"#\\(.number)\"] | join(\", \")")
          {
            echo "Moves the decdn pin to [decdn ${TAG}](https://github.com/decdn/decdn/releases/tag/${TAG})."
            echo
            echo "- From: \`${OLD_TAG:-(not a tag)}\` (\`${OLD_SHA}\`)"
            echo "- To: \`${TAG}\` (\`${NEW_SHA}\`), on crates.io"
            echo "- decdn changes: ${compare}"
            echo
            if [[ "$CHECK" != success ]]; then
              echo "**The lock does not check out** (\`cargo metadata --locked\` or"
              echo "\`check-decdn-pin.sh\` failed in the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
              echo
            fi
            if [[ -n "$others" ]]; then
              echo "Older bump PRs still open: ${others}. This one supersedes them."
              echo
            fi
            echo "Opened by the bump-decdn workflow (RELEASING.md § Pinning decdn)."
            echo "A red CI means the new decdn needs code changes here: push them to"
            echo "this branch."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "build: pin decdn to ${TAG}" --body-file "$RUNNER_TEMP/body.md"

      - name: Fail on a broken pin
        if: steps.check.outcome == 'failure'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          echo "::error::the decdn pin does not check out at ${TAG}; the PR needs work"
          exit 1
