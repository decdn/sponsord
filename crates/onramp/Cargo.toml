[package]
name = "sponsord-onramp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
tokio.workspace = true
anyhow.workspace = true
alloy.workspace = true
decdn-client.workspace = true
decdn-incentive.workspace = true
sponsord-core = { path = "../core" }
redb = "4"
reqwest = { version = "0.12", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait = "0.1"
axum = "0.8"
hex = "0.4"

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
sponsord-core = { path = "../core", features = ["test-support"] }
# Used by `test_support.rs` (pulled into the integration-test binary via
# `#[path]` from `tests/http_contract.rs`, not part of the shipped lib/bin).
tempfile = "3"
